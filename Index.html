<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        


    <title>Um convite especial</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="convite.css">

</head>

<body>

    <main>

        <section id="convite">

            <h1>💌 Um convite especial</h1>

            <p>Você aceita marcar um encontro comigo?</p>

            <button id="sim">Sim ❤️</button>

            <button id="nao">Não</button>

        </section>


        <section id="agendamento">

            <h2>📅 Escolha uma data</h2>

            <input type="date" id="data">

            <h2>⏰ Escolha um horário</h2>

            <input type="time" id="horario">

            <button id="confirmar">Confirmar encontro 💕</button>

        </section>


        <section id="resultado">

            <h2>💕 Encontro marcado!</h2>

            <p id="mensagem"></p>

        </section>

    </main>

    <script src="confirmar.js"></script>

</body>

</html>
